name: Build Vega-Next APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Force react-native-fs 2.34.0
        run: |
          rm -rf node_modules/@dr.pogodin/react-native-fs

          npm install @dr.pogodin/react-native-fs@2.34.0 \
            --save-exact \
            --force \
            --package-lock=false \
            --ignore-scripts=false

          echo "Installed react-native-fs:"
          node -e "console.log(require('./node_modules/@dr.pogodin/react-native-fs/package.json').version)"

      - name: Completely reinstall Sharp
        run: |
          rm -rf node_modules/sharp

          npm install sharp@0.32.6 \
            --include=optional \
            --platform=linux \
            --arch=x64 \
            --foreground-scripts \
            --no-save \
            --package-lock=false

          echo "Testing Sharp:"
          node -e "const sharp=require('sharp'); console.log('Sharp:', sharp.versions.sharp)"

      - name: Verify dependencies
        run: |
          echo "================================"
          echo "Node:"
          node --version

          echo "================================"
          echo "react-native-fs:"
          node -p "require('./node_modules/@dr.pogodin/react-native-fs/package.json').version"

          echo "================================"
          echo "Sharp:"
          node -p "require('./node_modules/sharp/package.json').version"

      - name: Apply Vega patches
        run: |
          npx patch-package

      - name: Set Android compileSdk 36
        run: |
          echo "================================"
          echo "Setting Android compileSdk to 36"
          echo "================================"

          # Make sure the file exists
          touch android/gradle.properties

          # Remove an existing compileSdk override if present.
          # Do not fail if there is nothing to remove.
          sed -i '/^[[:space:]]*android\.compileSdkVersion[[:space:]]*=/d' android/gradle.properties || true

          # Add the required compileSdk override.
          printf '\nandroid.compileSdkVersion=36\n' >> android/gradle.properties

          echo "Android Gradle properties:"
          cat android/gradle.properties

      - name: Verify Android SDK configuration
        working-directory: android
        run: |
          echo "================================"
          echo "Gradle SDK configuration"
          echo "================================"

          ./gradlew :app:properties --no-daemon 2>&1 \
            | grep -iE "compileSdk|minSdk|targetSdk" \
            || true

      - name: Verify Expo config
        run: |
          npx expo config --type public

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Next-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
