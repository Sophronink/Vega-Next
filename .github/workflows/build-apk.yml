name: Build Vega-Next APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fix react-native-fs version
        run: |
          npm install @dr.pogodin/react-native-fs@2.34.0 --no-save --package-lock=false --ignore-scripts

      - name: Install Sharp Linux binary
        run: |
          npm install sharp --include=optional --platform=linux --arch=x64 --no-save --package-lock=false
          
      - name: Apply Vega patches
        run: npx patch-package

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Next-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
