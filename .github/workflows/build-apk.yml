name: Build Vega-Next APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply Vega patches
        run: |
          npx patch-package expo-file-system react-native-video

          python3 <<'PY'
          from pathlib import Path

          p = Path("node_modules/@dr.pogodin/react-native-fs/android/src/main/java/com/drpogodin/reactnativefs/ReactNativeFsPackage.kt")

          text = p.read_text()

          if "hasConstants = true" not in text:
              old = "needsEagerInit = false,  // needsEagerInit"
              new = old + "\n        hasConstants = true, // hasConstants"
              
              if old not in text:
                  raise SystemExit("Could not find expected ReactNativeFsPackage.kt code")

              p.write_text(text.replace(old, new, 1))

          print("react-native-fs patch applied")

          PY

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Next-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
