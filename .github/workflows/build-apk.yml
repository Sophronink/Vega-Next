name: Build Vega-Next APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Verify Node.js
        run: |
          node --version
          npm --version
          which node

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Fix react-native-fs version
        run: |
          rm -rf node_modules/@dr.pogodin/react-native-fs

          npm install @dr.pogodin/react-native-fs@2.34.0 \
            --save-exact \
            --force \
            --no-save \
            --package-lock=false \
            --ignore-scripts

          echo "Installed react-native-fs version:"
          node -p "require('./node_modules/@dr.pogodin/react-native-fs/package.json').version"

      - name: Completely reinstall Sharp
        run: |
          rm -rf node_modules/sharp

          npm install sharp@0.32.6 \
            --include=optional \
            --platform=linux \
            --arch=x64 \
            --foreground-scripts \
            --no-save \
            --package-lock=false

          echo "Testing Sharp..."
          node -e "const sharp=require('sharp'); console.log('Sharp loaded:', sharp.versions.sharp)"

      - name: Verify required versions
        run: |
          echo "Node: $(node --version)"
          echo "react-native-fs: $(node -p "require('./node_modules/@dr.pogodin/react-native-fs/package.json').version")"
          echo "Sharp: $(node -p "require('./node_modules/sharp/package.json').version")"

      - name: Apply Vega patches
        run: npx patch-package

      - name: Verify Expo config
        run: npx expo config --type public

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Next-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
