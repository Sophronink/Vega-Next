name: Build Vega-Next APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NODE_ENV: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fix react-native-fs version
        run: |
          npm install @dr.pogodin/react-native-fs@2.34.0 \
            --no-save \
            --package-lock=false \
            --ignore-scripts

      - name: Install Sharp with native Linux binary
        run: |
          npm install sharp@0.32.6 \
            --platform=linux \
            --arch=x64 \
            --include=optional \
            --ignore-scripts=false \
            --no-save \
            --package-lock=false

          npm rebuild sharp --foreground-scripts

          echo "Checking Sharp..."
          node -e "console.log(require('sharp').versions)"

      - name: Apply Vega patches
        run: npx patch-package

      - name: Verify Expo config
        run: npx expo config --type public

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vega-Next-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
